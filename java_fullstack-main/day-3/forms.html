<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form tag</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend align="center">Login Form</legend>
            <label for="username">Username:</label>
            <input type="text" maxlength="10" placeholder="Enter username" id="username" name="username" required><br>
            <label for="password">Password:</label>
            <input type="password" maxlength="10" placeholder="Enter password" id="password" name="password" required><br> 
            <br> 
            <button type="submit">Login</button>
            <button type="reset">cancel</button>
        </fieldset>
    </form>
</body>
</html>

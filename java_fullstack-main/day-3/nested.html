<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested list</title>
</head>
<body>
    <h1>Nested Lists</h1>
    <hr>
    <ul>
        <li>Item 1</li>
        <li>Item 2
            <ul>
                <li>Sub-item 2.1</li>
                <li>Sub-item 2.2</li>
            </ul>
        </li>
        <li>Item 3</li>
    </ul>
</body>
</html>
